[build-system]
requires = ["setuptools>=70.1", "wheel", "Nuitka[build-wheel]", "toml"]
build-backend = "build_backend"
backend-path = ["."]

[project]
dependencies = [
    "pdfCropMargins",
    "debtcollector",
    "loguru>=0.5.3",
    "Pillow>=8.2.0",
    "watchdog>=2.1.9",
    "pdf2image>=1.16.0",
    "typed-classproperties",
    "simple-parsing",
]
name = "ml_writing_helper"
version = "0.11.1"
description = "Helper tool to insert created diagrams to markup language such as LaTeX, Markdown and HTML and so on."
authors = [{ name = "Hirotsugu Minowa" }]
requires-python = ">=3.12"

[project.optional-dependencies]
# doc_conv: mermaid / PlantUML diagrams in PDF (then run `playwright install chromium`)
doc = ["playwright>=1.40.0"]
dev = [
    "click",
    "build",
    "cibuildwheel",
    "Nuitka[app]",
    "pip-tools",
    "pytest >=5.2",
    "pip-versions  >=0.1.0",
    "mypy >=0.960",

]

[project.scripts]
ml_writing_helper = "ml_writing_helper.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ml_writing_helper*"]

[tool.nuitka]
follow-import-to = ["debtcollector"]
nofollow-import-to = [
    "numpy",
    "scipy",
    "tkinter",
    "Tkinter",
    "matplotlib",
    "pandas",
    "kiwisolver",
    "sqlite",
    "PySimpleGUI",
    "pdfCropMargins.gui",
]

[tool.cibuildwheel]
build = "cp312-* cp313-*"
skip = "*-musllinux_* *-win32"
archs = ["auto64"]
build-frontend = "build"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
